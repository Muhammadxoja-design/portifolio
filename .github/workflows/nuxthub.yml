name: Deploy to NuxtHub
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: "Deploy to NuxtHub"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (npm)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Debug repo (list files)
        run: |
          echo "Working dir: $(pwd)"
          ls -la
          echo "--- package.json ---"
          cat package.json || true
          echo "--- lockfiles ---"
          ls -la yarn.lock package-lock.json || true
          node -v
          npm -v

      # optional: remove leftover node_modules if you want a clean state
      - name: Ensure clean state (optional)
        run: |
          if [ -d node_modules ]; then rm -rf node_modules; fi

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Ensure NuxtHub module is installed
        run: npx nuxthub@latest ensure

      - name: Build & Deploy to NuxtHub
        uses: nuxt-hub/action@v2
        with:
          project-key: ${{ secrets.NUXTHUB_PROJECT_KEY }}
